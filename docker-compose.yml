version: "3.8"

# ============================================================
# 应用服务（backend + frontend）
# MySQL 使用独立容器，通过外部网络 mysql-net 连接
#
# 使用方法:
#   1. 先启动 MySQL:  cd mysql && docker-compose up -d
#   2. 再启动应用:    docker-compose up -d --build
# ============================================================

services:
  backend:
    build: ./backend
    container_name: auto-public-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8808:8808"
    volumes:
      - backend-uploads:/app/uploads
    networks:
      - app-net
      - mysql-net

  frontend:
    build: ./frontend
    container_name: auto-public-frontend
    restart: unless-stopped
    ports:
      - "9277:80"
    networks:
      - app-net
    depends_on:
      - backend

volumes:
  backend-uploads:

networks:
  app-net:
    driver: bridge
  mysql-net:
    external: true
